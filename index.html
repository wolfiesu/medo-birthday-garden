<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe3ff">
<title>Medo's Birthday Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c6fae;--blue:#8ec8f5;--deep:#5aa5e6;--pale:#dff0ff;--s:2;--pu:1.75;--sx:0px;--sy:0px;--sw:640px;--sh:360px;--k:2;--mk:1.4;--lw:360px;--ew:200px;--EH:123px;--fs:22px;--dpw:176px;--dph:68px;--jmp:80px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Press Start 2P',monospace;color:var(--ink);overscroll-behavior:none}
body{background:linear-gradient(#bfe3ff,#eef7ff) fixed;touch-action:none}
.hidden{display:none!important}
svg.ic{display:block;width:100%;height:100%}
button{font-family:inherit}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}

/* ---- stage ---- */
#stage{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);height:var(--sh);overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 6px #9fd0f5,0 10px 40px rgba(90,165,230,.35);border-radius:3px;background:#cfe8fb}
canvas#c{width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.pbtn{font-size:max(9px,calc(var(--s)*7px));color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:4px;padding:.95em 1.3em;cursor:pointer;box-shadow:0 4px 0 #9fd0f5;letter-spacing:.04em;touch-action:manipulation;display:inline-flex;align-items:center;gap:.7em;line-height:1}
.pbtn:hover{background:var(--pale)}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #9fd0f5}
.pbtn.big{font-size:max(11px,calc(var(--s)*9px))}
.pbtn .ic{width:1.2em;height:1em;color:#ff8fbb}
#titleUi{position:absolute;left:0;right:0;top:63%;text-align:center;padding-left:34%}
#titleUi .pbtn{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#pauseUi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;z-index:6;background:rgba(223,240,255,.8)}
#pauseUi h2{font-size:max(14px,calc(var(--s)*12px));margin:0 0 .4em;text-shadow:3px 3px 0 #fff}

/* ---- top bar: music player + sound + pause ---- */
#topbar{position:fixed;z-index:30;display:flex;align-items:stretch;gap:calc(var(--pu)*3px);top:calc(var(--sy) + var(--pu)*3px);right:calc(var(--sx) + var(--pu)*3px)}
body.portrait #topbar{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;right:auto;transform:translateX(-50%);width:min(94vw,470px)}
#music{position:relative;display:flex;align-items:center;gap:calc(var(--pu)*3.5px);width:calc(var(--pu)*130px);height:calc(var(--pu)*17px);padding:0 calc(var(--pu)*3.5px) 0 calc(var(--pu)*2px);background:#fff;border:max(2px,calc(var(--pu)*1.3px)) solid var(--ink);border-radius:calc(var(--pu)*3px);box-shadow:0 max(2px,calc(var(--pu)*1.3px)) 0 #9fd0f5;overflow:hidden}
body.portrait #music{flex:1;width:auto;height:44px}
.mbtn{flex:none;width:calc(var(--pu)*12px);height:calc(var(--pu)*12px);min-width:22px;min-height:22px;border:max(2px,calc(var(--pu)*1px)) solid var(--ink);background:var(--pale);color:var(--ink);padding:calc(var(--pu)*2.6px);border-radius:calc(var(--pu)*2px);cursor:pointer;touch-action:manipulation}
body.portrait .mbtn{width:34px;height:34px;padding:8px}
.mbtn:hover{background:#fff}
#music.playing #mPlay{background:var(--blue);color:#fff}
.minfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:calc(var(--pu)*1.4px);justify-content:center}
#mLab{font-size:max(6px,calc(var(--pu)*3.3px));letter-spacing:.06em;color:var(--deep);line-height:1;white-space:nowrap}
.mtitle{overflow:hidden;white-space:nowrap;font-size:max(8px,calc(var(--pu)*4.7px));line-height:1.2;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.mtrack{display:inline-block;animation:mq 10s linear infinite;animation-play-state:paused}
.mtrack span{padding-right:2.5em}
#music.playing .mtrack{animation-play-state:running}
@keyframes mq{to{transform:translateX(-50%)}}
.eq{flex:none;display:flex;align-items:flex-end;gap:max(1px,calc(var(--pu)*.8px));height:calc(var(--pu)*9px);min-height:12px}
.eq i{display:block;width:max(2px,calc(var(--pu)*1.8px));height:25%;background:var(--deep)}
#music.playing .eq i{animation:eq .8s steps(5) infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.55s!important}.eq i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{0%{height:20%}100%{height:100%}}
#hudBtns{display:flex;gap:calc(var(--pu)*3px)}
.hb{width:calc(var(--pu)*17px);height:calc(var(--pu)*17px);min-width:34px;min-height:34px;padding:calc(var(--pu)*4px);background:#fff;color:var(--ink);border:max(2px,calc(var(--pu)*1.3px)) solid var(--ink);border-radius:calc(var(--pu)*3px);cursor:pointer;box-shadow:0 max(2px,calc(var(--pu)*1.3px)) 0 #9fd0f5;touch-action:manipulation}
body.portrait .hb{width:44px;height:44px;padding:11px}
.hb:hover{background:var(--pale)}.hb:active{transform:translateY(2px);box-shadow:none}
.hb.off{opacity:.55}
#bPause{visibility:hidden}
body.playing #bPause{visibility:visible}
#spBox{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,94vw);background:#fff;border:3px solid var(--ink);border-radius:6px;padding:8px;box-shadow:0 4px 0 #9fd0f5;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .2s,transform .2s}
#spBox.open{opacity:1;pointer-events:auto;transform:none}
#spBox iframe{border:0;border-radius:8px;width:100%;height:80px;display:block}
#spNote{font-family:'VT323',monospace;font-size:18px;line-height:1.1;margin-top:6px;text-align:center;-webkit-user-select:text;user-select:text}
a.spl{display:block;margin-top:6px;font-size:8px;color:var(--ink);text-align:center}

/* ---- touch controls ---- */
#controls{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;touch-action:none}
body.touch.playing #controls{display:flex}
body.portrait{--dpw:min(66vw,260px);--dph:96px;--jmp:104px}
#dpad{pointer-events:auto;position:relative;display:flex;width:var(--dpw);height:var(--dph);background:rgba(255,255,255,.78);border:3px solid var(--ink);border-radius:var(--dph);box-shadow:0 5px 0 #9fd0f5,inset 0 0 0 3px #fff,inset 0 0 0 5px #cfe8fb;touch-action:none}
#dpad:before{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(#bcdcf8 0 4px,transparent 4px 8px)}
#dpad .arr{flex:1;display:grid;place-items:center;color:var(--ink);border-radius:var(--dph);padding:0 0}
#dpad .arr svg{width:32%;height:auto;max-height:42%}
#dpad .arr.on{background:var(--blue);color:#fff}
#jumpBtn{pointer-events:auto;width:var(--jmp);height:var(--jmp);border-radius:50%;background:rgba(255,255,255,.8);border:3px solid var(--ink);box-shadow:0 5px 0 #9fd0f5,inset 0 0 0 3px #fff,inset 0 0 0 5px #cfe8fb;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;touch-action:none;font-size:9px;letter-spacing:.05em}
#jumpBtn svg{width:34%;height:auto}
#jumpBtn.on{background:var(--blue);color:#fff;transform:translateY(3px);box-shadow:0 2px 0 #9fd0f5,inset 0 0 0 3px #fff}

/* ---- final birthday scene ---- */
#final{position:fixed;inset:0;z-index:15;background:#d4ecff}
#fbg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.fscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.fin{margin:auto;width:100%;max-width:1500px;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.portrait .fin{padding-top:calc(env(safe-area-inset-top,0px) + 82px)}
.ftitle{margin:0;font-weight:400;display:flex;flex-direction:column;align-items:center;line-height:1;text-align:center;--o:.075em}
.ftitle .l1{font-size:clamp(11px,min(3.1vw,4.6vh),34px);margin-bottom:.5em}
.ftitle .l2{font-size:clamp(24px,min(9vw,11vh),88px)}
body.portrait .ftitle .l1{font-size:clamp(11px,4.1vw,24px)}
.tl{display:inline-block;color:#fff;animation:hop 2.2s steps(1) infinite;animation-delay:calc(var(--i)*.11s);text-shadow:calc(var(--o)*-1) 0 var(--ink),var(--o) 0 var(--ink),0 calc(var(--o)*-1) var(--ink),0 var(--o) var(--ink),calc(var(--o)*-1) calc(var(--o)*-1) var(--ink),var(--o) calc(var(--o)*-1) var(--ink),calc(var(--o)*-1) var(--o) var(--ink),var(--o) var(--o) var(--ink),0 calc(var(--o)*2) 0 var(--deep)}
.tl.b{color:#cfe8fb}
@keyframes hop{0%,100%{transform:translateY(0)}6%{transform:translateY(-.14em)}12%{transform:translateY(-.22em)}18%{transform:translateY(-.1em)}24%{transform:translateY(0)}}
.fstage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,3.4vw,56px);width:100%}
body.portrait .fstage{flex-direction:column;align-items:center;gap:20px}
.bqCol{position:relative;flex:none;width:calc(var(--k)*150px);height:calc(var(--k)*180px);transform-origin:50% 100%}
.bqCol canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.bqCol:after{content:"";position:absolute;left:22%;right:22%;bottom:-5px;height:calc(var(--k)*5px);background:rgba(90,165,230,.22);border-radius:50%;z-index:-1}
.medoCol{flex:none;align-self:flex-end;padding-bottom:calc(var(--k)*3px)}
.medoCol canvas{display:block;width:calc(var(--mk)*40px);height:calc(var(--mk)*76px);image-rendering:pixelated}
body.portrait .medoCol{display:none}
@media (max-width:760px){.medoCol{display:none}}
.envCol{position:relative;flex:none;width:var(--lw);padding-bottom:calc(var(--EH)*.14)}
.eimg{position:absolute;left:calc((var(--lw) - var(--ew))/2);width:var(--ew);height:auto;image-rendering:pixelated;pointer-events:none}
#eBack{bottom:0;z-index:0}
#eFront{bottom:0;z-index:3}
#eUp{bottom:calc(var(--EH) - 2px);z-index:1}
#eDown{bottom:calc(var(--EH) - var(--ew)*31/78);z-index:4}
.letter{position:relative;z-index:2;transform-origin:50% 100%;background-color:#fffdf8;border:3px solid #cfe6fa;border-radius:3px;box-shadow:0 0 0 3px #fff,0 7px 0 3px rgba(90,165,230,.22);padding:calc(var(--fs)*1.2) calc(var(--fs)*1.1) calc(var(--EH)*.86 + var(--fs)*.4);
  background-image:linear-gradient(transparent calc(100% - 1px),#d9ebfb 0),linear-gradient(90deg,transparent calc(var(--fs)*1.9),#ffc9de calc(var(--fs)*1.9),#ffc9de calc(var(--fs)*1.9 + 2px),transparent calc(var(--fs)*1.9 + 2px));
  background-size:100% calc(var(--fs)*1.5),100% 100%;background-position:0 calc(var(--fs)*1.2),0 0;background-repeat:repeat-y,no-repeat}
.letter .tape{position:absolute;top:calc(var(--fs)*-.7);left:50%;width:calc(var(--fs)*5);height:calc(var(--fs)*1.3);margin-left:calc(var(--fs)*-2.5);background:repeating-linear-gradient(135deg,rgba(142,200,245,.85) 0 6px,rgba(255,255,255,.75) 6px 12px);transform:rotate(-2deg);border:1px solid rgba(90,165,230,.5)}
.paper{position:relative;font-family:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-weight:500;font-size:var(--fs);line-height:1.5;color:#2f5f9e;padding-left:calc(var(--fs)*1.2);-webkit-user-select:text;user-select:text}
.ln{margin:0}
.ln.hi{font-weight:700;font-size:1.08em}
.ln.sign{text-align:right;font-weight:700;color:#e0709f;font-size:1.15em;padding-right:.3em}
.w{display:inline-block;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.w.in{opacity:1;transform:none}
.w.hrt{width:.8em;height:.7em;color:#ff8fbb;vertical-align:-.04em;margin-left:.1em}
.deco{position:absolute;width:.8em;height:.8em;color:#8ec8f5;opacity:.9}
.deco.d1{right:-.1em;top:-.2em}.deco.d2{right:1.1em;top:.5em;width:.5em;height:.5em;color:#c9d3de}
.creases i{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(120,160,200,.5),transparent);pointer-events:none}
.creases i:nth-child(1){top:33%}.creases i:nth-child(2){top:62%}
#fBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
#fBtns .pbtn{font-size:clamp(10px,2.4vmin,13px)}
@media (prefers-reduced-motion:reduce){.tl,.mtrack,#titleUi .pbtn{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="640" height="360"></canvas>
  <div id="titleUi"><button id="startBtn" class="pbtn big">START <span data-ic="heart" style="display:inline-block;width:1.2em;height:1em;color:#ff8fbb"></span></button></div>
  <div id="pauseUi" class="hidden"><h2>PAUSED</h2><button id="resumeBtn" class="pbtn">RESUME</button><button id="restartBtn" class="pbtn">RESTART</button></div>
</div>

<div id="topbar">
  <div id="music" role="group" aria-label="Music player">
    <button id="mPlay" class="mbtn" aria-label="Play music"></button>
    <div class="minfo"><div id="mLab">LOADING</div><div class="mtitle"><div class="mtrack"><span>honeybee - Olivia Rodrigo</span><span>honeybee - Olivia Rodrigo</span></div></div></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button id="mDrawer" class="mbtn hidden" aria-label="Show Spotify player" data-ic="list" style="padding:calc(var(--pu)*3px)"></button>
  </div>
  <div id="hudBtns">
    <button id="bSfx" class="hb" aria-label="Sound effects on or off" data-ic="sfxOn"></button>
    <button id="bPause" class="hb" aria-label="Pause game" data-ic="pause"></button>
  </div>
  <div id="spBox"><div><div id="spHost"></div></div><div id="spNote">This is the Spotify player for the song.</div><a class="spl" href="https://open.spotify.com/track/407LgLkk1uM3wMO6jVRe0a" target="_blank" rel="noopener">open in spotify</a></div>
</div>

<div id="controls">
  <div id="dpad" role="group" aria-label="Move left or right"><div class="arr" data-d="left" data-ic="left"></div><div class="arr" data-d="right" data-ic="right"></div></div>
  <button id="jumpBtn" aria-label="Jump"><span data-ic="up" style="display:block;width:34%"></span>JUMP</button>
</div>

<section id="final" class="hidden" aria-label="Happy birthday Medo">
  <canvas id="fbg"></canvas>
  <div class="fscroll"><div class="fin">
    <h1 class="ftitle" id="fTitle" aria-label="Happy birthday Medo"></h1>
    <div class="fstage" id="fStage">
      <div class="medoCol" id="medoCol"><canvas id="fmedo" width="40" height="76"></canvas></div>
      <div class="bqCol" id="bqCol"><canvas id="fbq" width="150" height="180"></canvas><canvas id="fbqfx" width="150" height="180"></canvas></div>
      <div class="envCol" id="envCol">
        <img class="eimg" id="eBack" alt="">
        <img class="eimg" id="eUp" alt="">
        <div class="letter" id="letter"><div class="tape"></div><div class="paper" id="paper"></div><div class="creases"><i></i><i></i></div></div>
        <img class="eimg" id="eFront" alt="">
        <img class="eimg" id="eDown" alt="">
      </div>
    </div>
    <div id="fBtns"><button id="againBtn" class="pbtn">PLAY AGAIN</button><button id="replayBtn" class="pbtn">REPLAY SURPRISE</button></div>
  </div></div>
</section>

<script>
(()=>{
'use strict';
/* ============ setup ============ */
const W=640,H=360,T=32,GR=9,GY=GR*T;
const $=id=>document.getElementById(id);
const cv=$('c');let ctx=cv.getContext('2d');

const C={blue:'#8ec8f5',powder:'#b9defa',pale:'#dff0ff',deep:'#5aa5e6',ink:'#3c6fae',white:'#ffffff',silver:'#c9d3de',silver2:'#9aa9ba',pink:'#ffc2dc',pinkD:'#ff8fbb',yellow:'#ffe9a8',mint:'#a8e0c4'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function hash(n){n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n);}

let AC=null,sfxOn=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide,delay){
  if(!sfxOn)return;const a=ac();if(!a)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);
}

function pix(map){
  const h=map.length,w=map[0].length;let d='';
  map.forEach((r,y)=>{let x=0;while(x<w){if(r[x]==='X'){let n=1;while(x+n<w&&r[x+n]==='X')n++;d+='M'+x+' '+y+'h'+n+'v1h-'+n+'z';x+=n;}else x++;}});

const input={left:false,right:false,jump:false,down:false,jumpBuf:0};
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'jump',ArrowDown:'down',KeyS:'down'};
let state='title',paused=false;
addEventListener('keydown',e=>{
  const k=keyMap[e.code];
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)&&state!=='final')e.preventDefault();
  if(e.code==='KeyM'&&!e.repeat){Music.toggle();return;}
  if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat&&(state==='play'||state==='cut'))togglePause();return;}
  if(state==='title'&&(e.code==='Enter'||e.code==='Space')){startGame();return;}
  if(!k||state==='final')return;
  if(k==='jump'&&!input.jump&&!e.repeat)input.jumpBuf=7;
  input[k]=true;
});
addEventListener('keyup',e=>{const k=keyMap[e.code];if(k)input[k]=false;});
function clearInput(){input.left=input.right=input.jump=input.down=false;$('dpad').querySelectorAll('.arr').forEach(a=>a.classList.remove('on'));$('jumpBtn').classList.remove('on');}
addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(state==='play'&&!paused)togglePause();}});

/* sliding d-pad: one finger can glide from left to right without lifting */
(function bindControls(){
  const dp=$('dpad'),jb=$('jumpBtn');
  const aL=dp.querySelector('[data-d=left]'),aR=dp.querySelector('[data-d=right]');
  let dpId=null,jId=null;
  const setDir=d=>{input.left=d<0;input.right=d>0;aL.classList.toggle('on',d<0);aR.classList.toggle('on',d>0);};
  const read=e=>{const r=dp.getBoundingClientRect();return (e.clientX-r.left)/r.width<.5?-1:1;};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();ac();dpId=e.pointerId;try{dp.setPointerCapture(dpId);}catch(_){}setDir(read(e));});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)setDir(read(e));});
  const dUp=e=>{if(e.pointerId===dpId){dpId=null;setDir(0);}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>dp.addEventListener(n,dUp));
  jb.addEventListener('pointerdown',e=>{e.preventDefault();ac();jId=e.pointerId;try{jb.setPointerCapture(jId);}catch(_){}if(!input.jump)input.jumpBuf=7;input.jump=true;jb.classList.add('on');});
  const jUp=e=>{if(e.pointerId===jId){jId=null;input.jump=false;jb.classList.remove('on');}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>jb.addEventListener(n,jUp));
})();

addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');layout();}},{passive:true,once:true});

/* ============ layout (phone portrait, phone landscape, laptop) ============ */
const rootEl=document.documentElement;
function layout(){
  const vw=innerWidth,vh=innerHeight,portrait=vh>vw*1.05;
  const touch=document.body.classList.contains('touch');
  const topPad=portrait?64:0,botPad=(portrait&&touch)?180:0;
  const ah=Math.max(120,vh-topPad-botPad);
  const s0=Math.min(vw/W,ah/H),s=s0>=2?Math.floor(s0):s0;
  const sw=Math.round(W*s),sh=Math.round(H*s);
  const sx=Math.round((vw-sw)/2),sy=portrait?Math.round(topPad+Math.max(0,(ah-sh)*.3)):Math.round((vh-sh)/2);
  const st=rootEl.style;
  st.setProperty('--s',s.toFixed(3));st.setProperty('--sw',sw+'px');st.setProperty('--sh',sh+'px');
  st.setProperty('--sx',sx+'px');st.setProperty('--sy',sy+'px');
  st.setProperty('--pu',(portrait?1.75:clamp(s,1.15,2.3)).toFixed(2));
  document.body.classList.toggle('portrait',portrait);
  if(hooks.fit)hooks.fit();
}
const hooks={};
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));

function spark(x,y,n,cols,o){
  o=o||{};
  for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(.5,o.spd||2.6);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),g:o.g==null?.06:o.g,life:rnd(22,o.life||44),max:44,c:cols[i%cols.length],t:o.t||'s',sz:o.sz||1});}
}
function confetti(x,y,n,spread){
  const cols=['#ffffff','#8ec8f5','#b9defa','#c9d3de','#ffc2dc','#5aa5e6','#ffe9a8'];
  for(let i=0;i<n;i++)parts.push({x:x+rnd(-spread,spread),y,vx:rnd(-2.4,2.4),vy:rnd(-7,-2),g:.12,life:rnd(70,130),max:130,c:cols[i%cols.length],t:'c',sz:rnd(2,4),sp:rnd(.1,.35),ph:rnd(0,6.28)});
}
function hearts_(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+rnd(-8,8),y:y+rnd(-6,6),vx:rnd(-.6,.6),vy:rnd(-1.6,-.6),g:-.005,life:rnd(40,70),max:70,c:i%2?'#ffb3d1':'#ffffff',t:'h',sz:1});}
function stepParts(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(p.t==='c'){p.vx*=.985;p.vy=Math.min(p.vy,2.2);p.ph+=p.sp;}p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const q of pops){q.y-=.7;q.t--;}
  pops=pops.filter(q=>q.t>0);
}

function bump(b){

    pops.push({x:b.x+16,y:b.y-10,t:50,h:true});

    count++;flowerPulse=10;sfx.flower();

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function physics(locked){
  const p=P;
  const prevY=p.y,prevBottom=p.y+p.h;
  let dir=locked?0:(input.right?1:0)-(input.left?1:0);
  const acc=p.onGround?.5:.3,fr=p.onGround?.45:.06,max=3.4;
  if(dir){p.vx+=dir*acc;p.face=dir;}else{if(Math.abs(p.vx)<fr)p.vx=0;else p.vx-=Math.sign(p.vx)*fr;}
  p.vx=clamp(p.vx,-max,max);
  if(input.jumpBuf>0)input.jumpBuf--;
  p.coyote=p.onGround?6:Math.max(0,p.coyote-1);
  if(!locked&&input.jumpBuf>0&&p.coyote>0){p.vy=-11.6;p.coyote=0;input.jumpBuf=0;p.onGround=false;p.squash=-6;sfx.jump();}
  if(p.boost&&p.vy>=0)p.boost=false;
  if(!locked&&!input.jump&&!p.boost&&p.vy<-3.5)p.vy+=.9;
  if(!locked&&input.down&&p.onGround)p.drop=10;
  if(p.drop>0)p.drop--;
  p.vy=Math.min(p.vy+.52,12);
  /* horizontal */
  p.x+=p.vx;
  const solids=grounds.concat(blocks);
  for(const s of solids){if(ov(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;else p.x=p.x+p.w/2<s.x+s.w/2?s.x-p.w:s.x+s.w;p.vx=0;}}
  p.x=clamp(p.x,0,LEND-p.w);
  /* vertical */
  p.y+=p.vy;const wasGround=p.onGround;p.onGround=false;
  for(const s of solids){if(ov(p,s)){
    if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}
    else if(p.vy<0){p.y=s.y+s.h;p.vy=0;if(s.type)bump(s);}
  }}
  if(p.vy>=0&&p.drop<=0){
    for(const s of plats){
      if(p.x+p.w>s.x+2&&p.x<s.x+s.w-2){
        const nb=p.y+p.h;
        if(prevBottom<=s.y+.01&&nb>=s.y&&nb<=s.y+s.h+14){p.y=s.y-p.h;p.vy=0;p.onGround=true;}
      }
    }
  }
  if(p.onGround&&!wasGround&&prevY<p.y-3){p.squash=5;p.landT=7;spark(p.x+p.w/2,p.y+p.h,5,['#ffffff','#dff0ff'],{spd:1.3,g:.02,life:26});}
  if(p.squash>0)p.squash--;else if(p.squash<0)p.squash++;
  if(p.inv>0)p.inv--;
}

function step(){
  tick++;P.px=P.x;P.py=P.y;cam0=cam;
  if(!stepParts.skip)stepParts();
  if(state==='play'||state==='cut'||state==='card'){
    if(!paused){
      if(state==='play'||state==='cut'){
        physics(state==='cut');
        animUpdate();
        if(P.y>H+90){hearts--;if(hearts<=0){hearts=3;}respawn(false);}
        if(state==='play'){
          for(const f of flowers){if(f.got)continue;if(Math.abs(f.x-(P.x+P.w/2))<20&&Math.abs(f.y-(P.y+34))<42)collect(f);}
          for(const b of blocks)if(b.bump>0)b.bump--;
          for(const pd of pads){if(pd.anim>0)pd.anim--;if(pd.anim===0&&P.vy>=0&&ov(P,{x:pd.x,y:pd.y,w:pd.w,h:pd.h})){P.vy=-15.4;P.boost=true;P.onGround=false;pd.anim=14;sfx.spring();spark(pd.x+14,pd.y,8,['#ffffff','#b9defa'],{spd:2});}}
          cps.forEach((c,i)=>{if(!c.active&&P.x+P.w>c.x){c.active=true;lastCp=i+1;sfx.check();hearts_(c.x+4,GY-60,8);spark(c.x+4,GY-58,10,['#ffffff','#b9defa','#c9d3de'],{spd:2.4});if(hearts<3)hearts++;}});
          for(const e of enemies){
            if(!e.alive){if(e.dead>0)e.dead--;continue;}
            e.x+=e.vx;if(e.x<e.min){e.x=e.min;e.vx=Math.abs(e.vx);}if(e.x+e.w>e.max){e.x=e.max-e.w;e.vx=-Math.abs(e.vx);}
            if(ov(P,e)){
              if(P.vy>.5&&P.y+P.h-P.vy<=e.y+10){e.alive=false;e.dead=22;P.vy=input.jump?-10.5:-8;P.boost=true;sfx.stomp();spark(e.x+14,e.y+8,12,['#ffffff','#b9defa','#8ec8f5'],{spd:2.6});}
              else hurt(Math.sign(e.x-P.x)||1);
            }
          }
          if(!BQ.taken&&Math.abs((P.x+P.w/2)-(BQ.x+16))<26&&P.y+P.h>BQ.y-12){BQ.taken=true;state='cut';cs={t:0,sx:BQ.x+16,sy:BQ.y};sfx.fanfare();confetti(BQ.x+16,BQ.y,40,40);input.left=input.right=input.jump=false;}
          hintT++;
        }else{ /* cutscene */
          cs.t++;P.face=1;
          if(cs.t>=20&&cs.t<=46){const u=(cs.t-20)/26,e=u*u*(3-2*u);P.hx=lerp(cs.sx,P.x+P.w/2+19,e);P.hy=lerp(cs.sy,P.y+P.h-20,e)-Math.sin(u*Math.PI)*34;}
          if(cs.t===46){P.hasBQ=true;spark(P.x+P.w/2+15,P.y+P.h-34,14,['#ffffff','#ffe9a8','#b9defa'],{spd:3});}
          if(cs.t===64||cs.t===104){if(P.onGround){P.vy=-8;sfx.jump();}confetti(P.x+10,P.y,30,60);hearts_(P.x+10,P.y+10,8);}
          if(cs.t%14===0)spark(P.x+rnd(-40,50),P.y+rnd(-30,50),4,['#ffffff','#b9defa','#ffe9a8'],{spd:1.2});
          if(cs.t===176)goFinal();
        }
      }
      const target=clamp(P.x+P.w/2-W*.42+clamp(P.vx*9,-30,30),0,LEND-W);
      cam+=(target-cam)*.11;cam=clamp(cam,0,LEND-W);
      if(shake>0)shake--;
      if(flowerPulse>0)flowerPulse--;
    }
  }else if(state==='final'){
    Final.step();
  }
}
function firework(x,y){

  for(let i=0;i<34;i++){const a=i/34*6.28,s=rnd(1.4,2.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.04,life:rnd(40,60),max:60,c:cols[i%2],t:'s',sz:1});}

const HEART=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];

function drawFlower(x,y,type,ph,sc){
  sc=sc||1;x=Math.round(x);y=Math.round(y+Math.sin(ph)*2.5);

  ctx.fillRect(x-h-1,y-h-1,u+2,u+2);

function drawBouquet(cx,by,sc,t){
  const u=Math.max(1,Math.round(2*sc));cx=Math.round(cx);by=Math.round(by);

  /* paper */
  for(let k=0;k<9;k++){const w=3+k*1.1;R(cx-w*u/2*1,by-(k+1)*u*1.3+0,w*u,u*1.3+1,k%2?'#ffffff':'#eaf5ff');}
  R(cx-u*1.5,by-u*1.3,u*3,u*1.3,C.deep);
  for(let k=0;k<9;k++){const w=3+k*1.1;R(cx-w*u/2,by-(k+1)*u*1.3,u,u*1.3,C.blue);R(cx+w*u/2-u,by-(k+1)*u*1.3,u,u*1.3,C.blue);}
  /* ribbon */
  R(cx-3*u,by-5.4*u,6*u,u,C.deep);R(cx-5*u,by-7*u,3*u,2.4*u,C.blue);R(cx+2*u,by-7*u,3*u,2.4*u,C.blue);R(cx-u,by-6.2*u,2*u,2*u,C.ink);

}
function drawCake(x,by,s,t){

  const tier=(cx,w,h,y,body,fr)=>{R(cx-w/2,y-h,w,h,body);R(cx-w/2,y-h,w,4*s,'#fff');

    R(cx-w/2,y-h,2*s,h,'rgba(255,255,255,.35)');R(cx+w/2-2*s,y-h,2*s,h,'rgba(90,165,230,.25)');};

function medoPose(){
  const p=P;
  if(state==='cut'&&cs)return cs.t<46?'joy':((Math.floor(cs.t/14)&1)?'cheerA':'cheerB');
  if(p.inv>82)return 'hurt';
  if(!p.onGround)return p.vy<-1?'up':'fall';
  if(p.landT>0)return 'land';

    const dir=(input.right?1:0)-(input.left?1:0);

/* ============ music: one player that never restarts between screens ============ */
const Music=(()=>{
  const SONG_SRC='assets/song.mp3';
  const SPOTIFY_URI='spotify:track:407LgLkk1uM3wMO6jVRe0a';
  const SPOTIFY_URL='https://open.spotify.com/track/407LgLkk1uM3wMO6jVRe0a';
  const pill=$('music'),btn=$('mPlay'),lab=$('mLab'),drawerBtn=$('mDrawer'),box=$('spBox'),note=$('spNote');
  const audio=new Audio();audio.loop=true;audio.preload='auto';audio.volume=.85;
  let mode='probing',playing=false,wantPlay=false,sp=null,verifyT=0,fadeT=0;
  const api={userPaused:false};
  function ui(){
    btn.innerHTML=pix(ICON[playing?'pause':'play']).replace('<svg ','<svg class="ic" ');
    btn.setAttribute('aria-label',playing?'Pause music':'Play music');
    btn.setAttribute('aria-pressed',playing?'true':'false');
    pill.classList.toggle('playing',playing);
    lab.textContent=playing?'NOW PLAYING':mode==='probing'||mode==='loading'?(wantPlay?'STARTING':'LOADING'):mode==='link'?'OPEN SONG':api.userPaused?'PAUSED':'TAP TO PLAY';
    drawerBtn.classList.toggle('hidden',mode!=='spotify');
  }
  function fade(to,ms,done){
    clearInterval(fadeT);const from=audio.volume,t0=performance.now();
    fadeT=setInterval(()=>{const u=Math.min(1,(performance.now()-t0)/ms);audio.volume=Math.max(0,Math.min(1,from+(to-from)*u));if(u>=1){clearInterval(fadeT);if(done)done();}},30);
  }
  function playFile(){
    audio.volume=0;
    const pr=audio.play();
    const ok=()=>{playing=true;ui();fade(.85,700);};
    if(pr&&pr.then)pr.then(ok).catch(err=>{playing=false;wantPlay=false;if(err&&err.name!=='NotAllowedError'&&err.name!=='AbortError'){mode='probing';initSpotify();}ui();});else ok();
  }
  function pauseFile(){fade(0,350,()=>{audio.pause();playing=false;ui();});playing=false;ui();}
  function spPlay(){
    try{sp.play();}catch(e){}
    clearTimeout(verifyT);
    verifyT=setTimeout(()=>{if(!playing){box.classList.add('open');note.textContent='Press play on the Spotify player once. After that the song keeps going while you play.';}},2600);
  }
  function initSpotify(){
    if(mode!=='probing')return;mode='loading';ui();
    window.onSpotifyIframeApiReady=IFrameAPI=>{
      try{
        IFrameAPI.createController($('spHost'),{uri:SPOTIFY_URI,width:'100%',height:80},ctrl=>{
          sp=ctrl;mode='spotify';
          ctrl.addListener('playback_update',e=>{const was=playing;playing=!!e.data&&!e.data.isPaused;if(playing){clearTimeout(verifyT);if(!was)box.classList.remove('open');}ui();});
          ui();if(wantPlay)spPlay();
        });
      }catch(e){mode='link';ui();}
    };
    const s=document.createElement('script');s.src='https://open.spotify.com/embed/iframe-api/v1';s.async=true;
    s.onerror=()=>{if(mode==='loading'){mode='link';ui();}};document.head.appendChild(s);
    setTimeout(()=>{if(mode==='loading'){mode='link';ui();}},9000);
  }
  function init(){
    if(!SONG_SRC){initSpotify();return;}
    mode='file';
    audio.addEventListener('error',()=>{if(mode==='file'){mode='probing';initSpotify();}});
    audio.addEventListener('pause',()=>{if(mode==='file'&&!audio.ended&&audio.volume>0.02){playing=false;ui();}});
    audio.src=SONG_SRC;ui();
  }
  function toggle(){
    if(mode==='file'){if(playing){api.userPaused=true;pauseFile();}else{api.userPaused=false;playFile();}}
    else if(mode==='spotify'){if(playing){api.userPaused=true;try{sp.pause();}catch(e){}}else{api.userPaused=false;spPlay();}}
    else if(mode==='link'){window.open(SPOTIFY_URL,'_blank','noopener');}
    else{wantPlay=!wantPlay;api.userPaused=!wantPlay;ui();}
  }
  function autoStart(){
    if(playing||api.userPaused)return;
    if(mode==='file')playFile();
    else if(mode==='spotify')spPlay();
    else if(mode==='probing'||mode==='loading'){wantPlay=true;ui();}
  }
  btn.addEventListener('click',()=>{ac();toggle();try{btn.blur();}catch(e){}});
  drawerBtn.addEventListener('click',()=>{box.classList.toggle('open');note.textContent='This is the Spotify player for the song.';try{drawerBtn.blur();}catch(e){}});
  api.init=init;api.toggle=toggle;api.autoStart=autoStart;api.ui=ui;
  api.status=()=>({mode,playing});
  return api;
})();

/* draw a small sprite per-pixel, then add a 1px outline around it */
function mk(w,h,draw,outline){
  const cvs=document.createElement('canvas');cvs.width=w;cvs.height=h;const c=cvs.getContext('2d');
  const id=c.createImageData(w,h),d=id.data;
  const set=(x,y,col)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=w||y>=h)return;const k=(y*w+x)*4,r=hex(col);d[k]=r[0];d[k+1]=r[1];d[k+2]=r[2];d[k+3]=255;};
  draw(set,w,h);
  if(outline){
    const o=hex(outline),a=new Uint8Array(w*h);
    for(let i=0;i<w*h;i++)a[i]=d[i*4+3]>0?1:0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=y*w+x;if(a[i])continue;
      if((x>0&&a[i-1])||(x<w-1&&a[i+1])||(y>0&&a[i-w])||(y<h-1&&a[i+w])){d[i*4]=o[0];d[i*4+1]=o[1];d[i*4+2]=o[2];d[i*4+3]=255;}
    }
  }
  c.putImageData(id,0,0);return cvs;
}

    ICON.heart.forEach((row,y)=>{for(let x=0;x<7;x++)if(row[x]==='X')set(w-17+x,h-14+y,'#ff8fbb');});
  },78,48,'#4f86c4');
  const up=body((set,w,h)=>{for(let y=0;y<h;y++){const hw=(y+1)/h*(w/2);for(let x=Math.floor(w/2-hw);x<=Math.ceil(w/2+hw);x++){
      let col='#dcecfb';if((x+y)%6===0)col='#c9d3de';else if((x-y+300)%6===0)col='#ffffff';if(x<w/2-hw+2||x>w/2+hw-3)col='#9fd0f5';set(x,y,col);}}},78,19,'#4f86c4');
  const down=body((set,w,h)=>{for(let y=0;y<h;y++){const hw=(1-y/h)*(w/2);for(let x=Math.floor(w/2-hw);x<=Math.ceil(w/2+hw);x++){
      let col='#e6f3ff';if(y<2)col='#ffffff';if(x<w/2-hw+2||x>w/2+hw-3)col='#bcdcf8';set(x,y,col);}}
      for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const d=Math.hypot(x,y);if(d<=5.6){set(w/2+x,h-9+y,d>4.5?'#9aa9ba':(x+y<-2?'#eef3f8':'#c9d3de'));}}
      ICON.heart.forEach((row,y)=>{for(let x=0;x<7;x++)if(row[x]==='X'&&y<5)set(w/2-3+x,h-12+y,'#ff8fbb');});
  },78,31,'#4f86c4');
  return {back,front,up,down};
}

const Final=(()=>{
  const root=$('final'),fbg=$('fbg'),bg=fbg.getContext('2d'),bq=$('fbq'),fx=$('fbqfx'),fxc=fx.getContext('2d'),med=$('fmedo'),medc=med.getContext('2d');
  const titleEl=$('fTitle'),envCol=$('envCol'),letter=$('letter'),paper=$('paper'),bqCol=$('bqCol'),medoCol=$('medoCol'),btns=$('fBtns');
  const E={back:$('eBack'),front:$('eFront'),up:$('eUp'),down:$('eDown')};
  let built=false,tok=0,tt=0,ps=3,bw=1,bh=1,balloons=[],fp=[],words=[],active=false,reveal=0;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const CLOUDS=Array.from({length:7},(_,i)=>({x:hash(i+3)*400,y:14+hash(i+9)*90,w:30+hash(i+1)*30,sp:.05+hash(i+5)*.07}));
  const STARS=Array.from({length:50},(_,i)=>({x:hash(i)*500,y:hash(i+50)*260,p:hash(i+9)*6.28,b:hash(i+4)>.8}));
  const HEARTSVG=pix(ICON.heart).replace('<svg ','<svg class="ic" ');
  const MSG=[
    ['happy birthday, medo!',1,'hi'],
    ['a little world made just for u',0,''],
    ['hope your day is as lovely and special as you are.',0,''],
    ['you deserve all the happiness in the world',0,''],
    ['love uuuu',1,'sign']
  ];
  function build(){
    if(built)return;built=true;
    drawBouquetArt(bq);
    const art=envelopeArt();E.back.src=art.back;E.front.src=art.front;E.up.src=art.up;E.down.src=art.down;
    /* title letters */
    const mkLine=(txt,cls)=>{const d=document.createElement('div');d.className=cls;[...txt].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.setProperty('--i',i);s.className='tl'+(i%2?' b':'');d.appendChild(s);});return d;};
    titleEl.appendChild(mkLine('HAPPY BIRTHDAY','l1'));titleEl.appendChild(mkLine('MEDO!','l2'));
    /* letter text, word by word */
    MSG.forEach(([txt,heart,cls])=>{
      const p=document.createElement('p');p.className='ln '+cls;
      txt.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;p.appendChild(s);p.appendChild(document.createTextNode(' '));words.push(s);});
      if(heart){const h=document.createElement('span');h.className='w hrt';h.innerHTML=HEARTSVG;p.appendChild(h);words.push(h);}
      paper.appendChild(p);
    });
    paper.insertAdjacentHTML('beforeend','<div class="deco d1">'+pix(ICON.star)+'</div><div class="deco d2">'+pix(ICON.star)+'</div>');
  }
  function fit(){
    const vw=innerWidth,vh=innerHeight,portrait=vh>vw*1.05;
    ps=Math.max(2,Math.round(Math.min(vw,vh*16/9)/320));
    const nbw=Math.ceil(vw/ps),nbh=Math.ceil(vh/ps);
    if(nbw!==bw||nbh!==bh){bw=nbw;bh=nbh;fbg.width=bw;fbg.height=bh;if(!balloons.length)initBg();}
    let bH,lw;
    if(portrait){bH=Math.min(vh*.33,vw*.72*180/150);lw=Math.min(vw*.94,460);}
    else{bH=Math.max(150,Math.min(vh-Math.min(vh*.3,vh*.2+30)-84,480));lw=Math.min(vw*.4,bH*.98+40,520);}
    const k=Math.max(.8,bH/180);
    const st=rootEl.style;
    st.setProperty('--k',k.toFixed(3));st.setProperty('--lw',Math.round(lw)+'px');
    st.setProperty('--ew',Math.round(lw*.5)+'px');st.setProperty('--EH',Math.round(lw*.5*48/78)+'px');
    st.setProperty('--fs',clamp(lw*.052,14,25).toFixed(1)+'px');
    st.setProperty('--mk',Math.max(1,k*.8).toFixed(2));
  }
  function initBg(){
    balloons=Array.from({length:Math.max(10,Math.round(bw/26))},(_,i)=>({x:hash(i+40)*bw,y:bh*(.2+hash(i+70)*1.0),c:['#ffffff','#b9defa','#8ec8f5','#c9d3de','#dff0ff','#ffc2dc'][i%6],sp:.12+hash(i+11)*.2,ph:hash(i)*6.28}));
  }
  function burst(x,y,n,spread){
    const cols=['#ffffff','#8ec8f5','#b9defa','#c9d3de','#ffc2dc','#5aa5e6','#ffe9a8'];
    for(let i=0;i<n;i++)fp.push({x:x+(Math.random()-.5)*spread,y,vx:(Math.random()-.5)*3,vy:-2-Math.random()*4.5,g:.1,life:90+Math.random()*60,c:cols[i%cols.length],t:'c',sz:1+((Math.random()*2)|0),ph:Math.random()*6.28,sp:.1+Math.random()*.25});
  }
  function firework(x,y){
    const cols=[['#ffffff','#b9defa'],['#8ec8f5','#ffffff'],['#ffc2dc','#ffffff'],['#c9d3de','#dff0ff']][(Math.random()*4)|0];
    for(let i=0;i<30;i++){const a=i/30*6.283,s=.9+Math.random()*.9;fp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.03,life:40+Math.random()*24,c:cols[i%2],t:'s'});}
    tone(500+Math.random()*400,.25,'triangle',.025,-300);
  }
  function step(){
    tt++;
    for(const b of balloons){b.y-=b.sp;if(b.y<-30){b.y=bh+20+Math.random()*60;b.x=Math.random()*bw;}}
    for(const p of fp){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(p.t==='c'){p.vx*=.985;p.vy=Math.min(p.vy,1.4);p.ph+=p.sp;}p.life--;}
    fp=fp.filter(p=>p.life>0&&p.y<bh+10);
    if(reveal>=2&&tt%46===0)firework(bw*(.12+Math.random()*.76),bh*(.1+Math.random()*.3));
    if(tt%9===0)burst(Math.random()*bw,-4,1,0);
  }
  function drawBg(){
    withCtx(bg,()=>{
      bg.imageSmoothingEnabled=false;
      const g=bg.createLinearGradient(0,0,0,bh);g.addColorStop(0,'#a6d6fa');g.addColorStop(.55,'#d4ecff');g.addColorStop(1,'#f3faff');
      bg.fillStyle=g;bg.fillRect(0,0,bw,bh);
      for(const s of STARS){const tw=(Math.sin(tt/18+s.p)+1)/2;if(tw>.3){bg.globalAlpha=.35+tw*.65;const x=Math.floor(s.x%bw),y=Math.floor(s.y%(bh*.7));if(s.b)sparkle(x,y,1,'#ffffff');else R(x,y,1,1,'#ffffff');}}
      bg.globalAlpha=1;
      for(const c of CLOUDS){const x=(((c.x-tt*c.sp)%(bw+90))+bw+90)%(bw+90)-45;drawCloud(x,c.y*(bh/200),c.w,'rgba(255,255,255,.95)','rgba(190,222,248,.9)');}
      /* soft hills */
      for(let x=0;x<bw;x++){const h1=bh*.74+Math.sin(x/22+1)*5+Math.sin(x/8)*1.5,h2=bh*.82+Math.sin(x/15+3)*4;R(x,h1,1,bh,'#c6e2fa');R(x,h2,1,bh,'#b3d8f7');}
      /* ground with frosting edge */
      const gy=bh-14;R(0,gy,bw,14,'#b9defa');R(0,gy,bw,4,'#ffffff');R(0,gy+4,bw,1,'#e8f4ff');
      for(let x=0;x<bw;x+=3){const dh=2+((hash(x)*3)|0);R(x,gy+4,2,dh,'#ffffff');}
      for(let x=2;x<bw;x+=9)R(x,gy+9,1,1,hash(x)>.5?'#ffc2dc':'#ffffff');
      for(const b of balloons)drawBalloon(b.x+Math.sin(tt/40+b.ph)*3,b.y,b.c,.9,0,14);
      /* bunting across the top */
      const n=Math.max(8,Math.floor(bw/16));
      for(let i=0;i<=n;i++){const u=i/n,x=u*bw,y=3+Math.sin(u*Math.PI)*6,col=['#ffffff','#8ec8f5','#b9defa'][i%3];
        for(let k=0;k<8;k++){const w=Math.max(1,10-k*1.3);R(x-w/2,y+k,w,1,col);}R(x-5,y,10,1,'#9fd0f5');}
      for(const p of fp){bg.globalAlpha=clamp(p.life/20,0,1);const x=Math.round(p.x),y=Math.round(p.y);
        if(p.t==='s')sparkle(x,y,1,p.c);else R(x,y,Math.max(1,Math.round(p.sz*(.5+Math.abs(Math.sin(p.ph))))),p.sz,p.c);}
      bg.globalAlpha=1;
    });
  }
  function drawFx(){
    fxc.clearRect(0,0,fx.width,fx.height);
    if(reveal<1)return;
    withCtx(fxc,()=>{
      const pts=[[18,30],[132,22],[8,100],[142,96],[75,6],[40,12],[112,10],[22,150],[128,150]];
      pts.forEach(([x,y],i)=>{const ph=(tt+i*11)%60;if(ph<30){const s=ph<10||ph>20?1:2;sparkle(x,y,s,i%3===0?'#ffe9a8':'#ffffff');}});
    });
  }
  function drawMedo(){
    medc.clearRect(0,0,med.width,med.height);
    const cyc=Math.floor(tt/20)&1;let nm=reveal>=1?(cyc?'cheerA':'cheerB'):'idle0';
    if(reveal<1&&tt%150<8)nm='idle0_b';
    drawMedoFrame(medc,nm,20,med.height-2,1,false);
  }
  function render(){drawBg();drawFx();drawMedo();}
  const anim=(el,kf,o)=>{try{return el.animate(kf,Object.assign({fill:'both',easing:'ease-out'},o));}catch(e){return null;}};
  function resetScene(){
    [bqCol,medoCol,E.back,E.front,E.up,E.down,letter,btns].forEach(el=>{el.getAnimations&&el.getAnimations().forEach(a=>a.cancel());el.style.cssText='';});
    bqCol.style.opacity='0';E.back.style.opacity=E.front.style.opacity=E.down.style.opacity='0';E.up.style.transform='scaleY(0)';E.up.style.transformOrigin='50% 100%';
    letter.style.opacity='0';medoCol.style.opacity='0';btns.style.opacity='0';
    words.forEach(w=>w.classList.remove('in'));
    document.querySelectorAll('#letter .creases i').forEach(i=>{i.style.opacity='1';});
    letter.classList.remove('open');
  }
  async function play(){
    const my=++tok;const ok=()=>my===tok&&active;
    resetScene();fit();
    await wait(150);if(!ok())return;
    /* 1. bouquet pops in */
    reveal=1;
    anim(bqCol,[{opacity:0,transform:'translateY(40px) scale(.25)'},{opacity:1,transform:'translateY(-6px) scale(1.07)',offset:.7},{opacity:1,transform:'none'}],{duration:1000,easing:'cubic-bezier(.3,1.3,.5,1)'});
    anim(medoCol,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:700,delay:350});
    sfx.heart();burst(bw*.4,bh*.9,40,bw*.4);
    await wait(1250);if(!ok())return;
    /* 2. envelope slides in */
    [E.back,E.front,E.down].forEach(el=>anim(el,[{opacity:0,transform:'translateY(36px)'},{opacity:1,transform:'none'}],{duration:650}));
    if(innerHeight>innerWidth*1.05){try{envCol.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}}
    tone(660,.12,'triangle',.04,200);
    await wait(1000);if(!ok())return;
    /* 3. flap opens */
    anim(E.down,[{transform:'scaleY(1)',transformOrigin:'50% 0%'},{transform:'scaleY(0)',transformOrigin:'50% 0%'}],{duration:480,easing:'ease-in'});
    anim(E.up,[{transform:'scaleY(0)',transformOrigin:'50% 100%'},{transform:'scaleY(1)',transformOrigin:'50% 100%'}],{duration:480,delay:300,easing:'ease-out'});
    sfx.check();
    await wait(850);if(!ok())return;
    /* 4. folded letter rises out */
    const Lh=letter.offsetHeight,EHp=parseFloat(getComputedStyle(rootEl).getPropertyValue('--EH'))||100,sx0=.5,sy0=.46;
    const y0=Math.max(0,sy0*Lh+EHp*.14-EHp+6),rise=Math.max(34,Math.min(90,Lh*.2));
    letter.style.opacity='1';
    letter.querySelectorAll('.paper').forEach(p=>p.style.opacity='0');
    const rs=anim(letter,[{transform:'translateY('+y0+'px) scale('+sx0+','+sy0+')'},{transform:'translateY('+(-rise)+'px) scale('+sx0+','+sy0+')'}],{duration:1100,easing:'cubic-bezier(.3,.7,.3,1)'});
    tone(520,.5,'triangle',.03,260);
    await wait(1180);if(!ok())return;
    /* 5. unfolds, then the handwriting appears */
    anim(letter,[{transform:'translateY('+(-rise)+'px) scale('+sx0+','+sy0+')'},{transform:'translateY(0) scale(1,1)'}],{duration:1000,easing:'cubic-bezier(.3,1.2,.5,1)'});
    document.querySelectorAll('#letter .creases i').forEach(i=>anim(i,[{opacity:1},{opacity:0}],{duration:1100,delay:500}));
    anim(paper,[{opacity:0},{opacity:1}],{duration:500,delay:400});
    reveal=2;sfx.fanfare();burst(bw*.5,bh*.95,60,bw*.8);
    await wait(1100);if(!ok())return;
    letter.classList.add('open');
    words.forEach((w,i)=>setTimeout(()=>{if(my===tok)w.classList.add('in');},i*85));
    anim(btns,[{opacity:0},{opacity:1}],{duration:600,delay:words.length*85});
    if(innerHeight>innerWidth*1.05){try{letter.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}}
  }
  return{
    fit,render,step,
    show(){active=true;build();root.classList.remove('hidden');root.querySelector('.fscroll').scrollTop=0;tt=0;reveal=0;fp=[];fit();play();},
    replay(){tt=0;reveal=0;fp=[];play();},
    stop(){active=false;tok++;root.classList.add('hidden');},
    get active(){return active;}
  };
})();
hooks.fit=()=>{if(Final.active)Final.fit();};

/* ============ boot ============ */
let last=0,acc=0;
function frame(ts){
  if(!last)last=ts;let dt=ts-last;last=ts;if(dt>100)dt=100;acc+=dt;
  while(acc>=1000/60){if(!paused||state==='title'||state==='final')step();acc-=1000/60;}
  ia=paused?1:Math.min(1,acc/(1000/60));
  render();requestAnimationFrame(frame);
}
function boot(){
  buildLevel();
  Music.init();
  requestAnimationFrame(frame);
  window.__medo={step,render,Music,Final,goFinal,startGame,get s(){return{state,P,cam,count,hearts,lastCp,paused,cs};},tp(x,y){P.x=x;if(y!=null)P.y=y;P.vx=P.vy=0;},BQ,get flowers(){return flowers},get blocks(){return blocks},get enemies(){return enemies},get pads(){return pads},input,rebuild(){buildLevel();BQ.taken=false;state='play';paused=false;},set inv(v){P.inv=v}};
}
})();
